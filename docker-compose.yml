services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elcoral
      POSTGRES_PASSWORD: elcoral_dev_password
      POSTGRES_DB: elcoral
    ports:
      - "5432:5432"
    volumes:
      - elcoral_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://elcoral:elcoral_dev_password@db/elcoral
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  elcoral_db_data:
